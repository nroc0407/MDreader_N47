<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MD_RENDER — 마크다운 변환기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Spectral:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.8/purify.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/turndown/7.0.0/turndown.min.js"></script>
<script>
  // 저장된 테마를 렌더링 전에 적용 (깜빡임 방지)
  (function(){
    try{
      const saved = localStorage.getItem('mdrender.theme');
      if(saved === 'light' || saved === 'dark') document.documentElement.setAttribute('data-theme', saved);
    }catch(e){}
  })();
</script>
<style>
  :root[data-theme="dark"]{
    --bg:#0b0d10;
    --surface:#14171c;
    --surface-2:#1b1f26;
    --surface-3:#21262e;
    --border:#272c34;
    --text:#e7e9ec;
    --text-dim:#8a92a0;
    --text-faint:#565d68;
    --accent:#e0a458;
    --accent-soft:#e0a45822;
    --accent-2:#b8503a;
    --code-text:#d7dbe0;
    --shadow:0 8px 24px rgba(0,0,0,0.35);
  }
  :root[data-theme="light"]{
    --bg:#f3f0e9;
    --surface:#fbfaf6;
    --surface-2:#efece3;
    --surface-3:#e6e2d6;
    --border:#dcd7c8;
    --text:#23211c;
    --text-dim:#6b665a;
    --text-faint:#a39d8c;
    --accent:#b3631f;
    --accent-soft:#b3631f1a;
    --accent-2:#8c3526;
    --code-text:#2a2722;
    --shadow:0 8px 24px rgba(0,0,0,0.08);
  }

  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'JetBrains Mono',monospace;
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }

  /* ---------- topbar ---------- */
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:14px 20px;
    border-bottom:1px solid var(--border);
    background:var(--surface);
    flex-shrink:0;
    gap:16px;
    flex-wrap:wrap;
  }
  .brand{
    font-weight:700;
    font-size:15px;
    letter-spacing:0.06em;
    color:var(--text);
    display:flex;
    align-items:center;
    gap:2px;
  }
  .brand .cursor{
    color:var(--accent);
    animation:blink 1.1s steps(2,start) infinite;
  }
  @keyframes blink{ to{ opacity:0; } }

  .toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  .table-hint{
    display:flex;
    align-items:center;
    gap:8px;
    padding:6px 10px;
    border:1px solid var(--border);
    border-radius:8px;
    background:var(--surface-2);
    color:var(--text-dim);
    font-size:10px;
    letter-spacing:0.02em;
    white-space:nowrap;
  }
  .table-hint strong{ color:var(--accent); letter-spacing:0.12em; }
  .btn.small{ padding:5px 8px; font-size:10px; }
  .btn{
    font-family:inherit;
    font-size:12px;
    font-weight:500;
    letter-spacing:0.02em;
    color:var(--text-dim);
    background:var(--surface-2);
    border:1px solid var(--border);
    border-radius:6px;
    padding:7px 12px;
    cursor:pointer;
    transition:border-color .15s,color .15s,background .15s;
    white-space:nowrap;
  }
  .btn:hover{ border-color:var(--accent); color:var(--text); }
  .btn.primary{ color:var(--bg); background:var(--accent); border-color:var(--accent); }
  .btn.primary:hover{ background:var(--accent-2); border-color:var(--accent-2); color:#fff; }
  .btn.ghost{ background:transparent; }

  /* ---------- workspace ---------- */
  .workspace{
    flex:1;
    display:grid;
    grid-template-columns:1fr 1fr;
    overflow:hidden;
    min-height:0;
  }
  .pane{
    display:flex;
    flex-direction:column;
    min-height:0;
    border-right:1px solid var(--border);
  }
  .pane:last-child{ border-right:none; }
  .pane-label{
    font-size:10px;
    letter-spacing:0.12em;
    color:var(--text-faint);
    padding:9px 16px;
    border-bottom:1px solid var(--border);
    background:var(--surface);
    flex-shrink:0;
  }

  /* ---------- editor ---------- */
  .editor-pane{ position:relative; background:var(--surface); }
  .editor-shell{
    flex:1;
    display:flex;
    overflow:hidden;
    min-height:0;
  }
  .line-numbers{
    flex-shrink:0;
    width:44px;
    overflow:hidden;
    text-align:right;
    padding:16px 8px 16px 0;
    font-size:13px;
    line-height:1.65;
    color:var(--text-faint);
    background:var(--surface);
    user-select:none;
  }
  #editor{
    flex:1;
    resize:none;
    border:none;
    outline:none;
    background:transparent;
    color:var(--text);
    font-family:'JetBrains Mono',monospace;
    font-size:13px;
    line-height:1.65;
    padding:16px 16px 16px 4px;
    white-space:pre;
    overflow:auto;
  }
  .editor-pane.dragover::after{
    content:"여기에 파일을 놓으세요";
    position:absolute;
    inset:0;
    top:33px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--accent-soft);
    border:2px dashed var(--accent);
    color:var(--accent);
    font-size:13px;
    z-index:5;
  }

  /* ---------- preview ---------- */
  .preview-pane{ background:var(--bg); }
  .markdown-body[contenteditable="true"]{ cursor:text; outline:none; min-height:100%; }
  #previewScroll:focus-within{ box-shadow:inset 0 0 0 1px var(--accent-soft); }
  #previewScroll{
    flex:1;
    overflow:auto;
    padding:36px 44px;
  }
  .markdown-body{
    font-family:'Spectral',Georgia,serif;
    color:var(--text);
    font-size:16px;
    line-height:1.75;
    max-width:680px;
    margin:0 auto;
  }
  .markdown-body h1,.markdown-body h2,.markdown-body h3,
  .markdown-body h4,.markdown-body h5{
    font-family:'JetBrains Mono',monospace;
    color:var(--text);
    font-weight:700;
    line-height:1.3;
    margin:1.6em 0 0.6em;
  }
  .markdown-body h1{
    font-size:1.9em;
    padding-bottom:0.35em;
    border-bottom:1px solid var(--border);
  }
  .markdown-body h2{
    font-size:1.4em;
    color:var(--accent);
  }
  .markdown-body h3{ font-size:1.1em; }
  .markdown-body h1:first-child,.markdown-body h2:first-child{ margin-top:0; }
  .markdown-body p{ margin:0.9em 0; }
  .markdown-body a{ color:var(--accent); text-decoration:none; border-bottom:1px solid var(--accent-soft); }
  .markdown-body a:hover{ border-bottom-color:var(--accent); }
  .markdown-body strong{ color:var(--text); }
  .markdown-body em{ color:var(--text-dim); }
  .markdown-body blockquote{
    margin:1em 0;
    padding:0.4em 1em;
    border-left:3px solid var(--accent-2);
    background:var(--surface-2);
    color:var(--text-dim);
  }
  .markdown-body blockquote p{ margin:0.4em 0; }
  .markdown-body ul,.markdown-body ol{ padding-left:1.4em; margin:0.9em 0; }
  .markdown-body li{ margin:0.3em 0; }
  .markdown-body li input[type="checkbox"]{ margin-right:0.5em; }
  .markdown-body code{
    font-family:'JetBrains Mono',monospace;
    font-size:0.85em;
    color:var(--accent);
    background:var(--surface-2);
    padding:0.15em 0.4em;
    border-radius:4px;
  }
  .markdown-body pre{
    background:var(--surface-2);
    border:1px solid var(--border);
    border-radius:8px;
    padding:14px 16px;
    overflow:auto;
    margin:1.2em 0;
  }
  .markdown-body pre code{
    background:none;
    color:var(--code-text);
    padding:0;
    font-size:0.85em;
    line-height:1.6;
  }
  .markdown-body .table-wrap{
    max-width:100%;
    overflow-x:auto;
    margin:1.2em 0;
    padding-bottom:2px;
  }
  .table-tools{
    display:flex;
    justify-content:flex-end;
    align-items:center;
    gap:6px;
    min-width:max-content;
    margin:0 0 6px;
  }
  .table-copy-excel-btn{
    padding:4px 8px;
    font-size:10px;
    line-height:1.2;
  }
  .table-copy-excel-btn[data-state="copied"]{
    border-color:var(--accent);
    color:var(--accent);
  }
  .markdown-body table{
    width:100%;
    border-collapse:collapse;
    margin:0;
    font-family:'JetBrains Mono',monospace;
    font-size:0.82em;
    table-layout:fixed;
  }
  .markdown-body th,.markdown-body td{
    position:relative;
    border:1px solid var(--border);
    padding:7px 10px;
    text-align:left;
    min-width:48px;
    vertical-align:top;
    word-break:break-word;
  }
  .markdown-body th{ background:var(--surface-2); color:var(--accent); }
  .col-resize-handle{
    position:absolute;
    top:-1px;
    right:-4px;
    width:8px;
    height:calc(100% + 2px);
    cursor:col-resize;
    user-select:none;
    touch-action:none;
    z-index:4;
  }
  .col-resize-handle::after{
    content:"";
    position:absolute;
    top:0;
    bottom:0;
    left:3px;
    width:1px;
    background:transparent;
  }
  .col-resize-handle:hover::after,
  body.table-resizing .col-resize-handle::after{
    background:var(--accent);
  }
  body.table-resizing{ cursor:col-resize; user-select:none; }
  .markdown-body hr{ border:none; border-top:1px solid var(--border); margin:2em 0; }
  .markdown-body img{ max-width:100%; border-radius:6px; }

  /* ---------- statusbar ---------- */
  .statusbar{
    display:flex;
    gap:20px;
    padding:8px 20px;
    border-top:1px solid var(--border);
    background:var(--surface);
    font-size:11px;
    color:var(--text-faint);
    flex-shrink:0;
  }

  /* ---------- responsive ---------- */
  @media (max-width:860px){
    .workspace{ grid-template-columns:1fr; grid-template-rows:1fr 1fr; }
    .pane{ border-right:none; border-bottom:1px solid var(--border); }
    #previewScroll{ padding:24px; }
    .table-hint{ width:100%; overflow-x:auto; }
  }

  ::selection{ background:var(--accent-soft); }
  *:focus-visible{ outline:2px solid var(--accent); outline-offset:1px; }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">MD<span class="cursor">_</span>RENDER</div>
  <div class="toolbar">
    <label class="btn" for="fileInput">파일 불러오기</label>
    <input type="file" id="fileInput" accept=".md,.markdown,.txt" hidden>
    <div class="table-hint" title="표 첫 행의 셀 오른쪽 경계선을 드래그하면 해당 열 너비가 조절됩니다.">
      <strong>TABLE</strong> 첫 행 셀 경계선 드래그
      <button class="btn small ghost" id="tableResetBtn" type="button">표 너비 초기화</button>
    </div>
    <button class="btn" id="copyBtn">HTML 복사</button>
    <button class="btn primary" id="exportBtn">.html 내보내기</button>
    <button class="btn" id="themeBtn">라이트</button>
    <button class="btn ghost" id="sampleBtn" title="예제 문서 불러오기">샘플</button>
    <button class="btn ghost" id="clearBtn" title="내용과 자동 저장된 초안을 모두 지웁니다">지우기</button>
  </div>
</div>

<div class="workspace">
  <section class="pane editor-pane" id="dropZone">
    <div class="pane-label">EDITOR</div>
    <div class="editor-shell">
      <div class="line-numbers" id="lineNumbers">1</div>
      <textarea id="editor" spellcheck="false" placeholder="마크다운을 입력하거나 파일을 드래그하세요..."></textarea>
    </div>
  </section>
  <section class="pane preview-pane">
    <div class="pane-label">PREVIEW · 직접 편집 가능</div>
    <div id="previewScroll">
      <article class="markdown-body" id="preview" contenteditable="true" spellcheck="false"></article>
    </div>
  </section>
</div>

<div class="statusbar">
  <span id="charCount">0 자</span>
  <span id="wordCount">0 단어</span>
  <span id="readTime">0분 읽기</span>
</div>

<script>
  const editor = document.getElementById('editor');
  const preview = document.getElementById('preview');
  const previewScroll = document.getElementById('previewScroll');
  const lineNumbers = document.getElementById('lineNumbers');
  const dropZone = document.getElementById('dropZone');
  const tableResetBtn = document.getElementById('tableResetBtn');

  marked.setOptions({ gfm:true, breaks:false });

  // ---------- localStorage (자동 저장) ----------
  // 사파리 사생활 보호 모드, 저장소 차단, 용량 초과 등에서 예외가 날 수 있으므로 모두 try/catch.
  const STORAGE_KEYS = { draft:'mdrender.draft', theme:'mdrender.theme' };
  function storageGet(key){
    try{ return localStorage.getItem(key); }catch(e){ return null; }
  }
  function storageSet(key, value){
    try{ localStorage.setItem(key, value); }catch(e){}
  }
  function storageRemove(key){
    try{ localStorage.removeItem(key); }catch(e){}
  }

  let draftSaveTimer = null;
  function saveDraft(){
    clearTimeout(draftSaveTimer);
    const value = editor.value;
    // 빈 문서나 기본 샘플은 저장하지 않는다 (다음 방문 시 샘플 표시)
    if(!value || value === SAMPLE) storageRemove(STORAGE_KEYS.draft);
    else storageSet(STORAGE_KEYS.draft, value);
  }
  function scheduleDraftSave(){
    clearTimeout(draftSaveTimer);
    draftSaveTimer = setTimeout(saveDraft, 400);
  }

  // ---------- preview -> markdown (역방향 변환) ----------
  const turndownService = new TurndownService({
    headingStyle:'atx',
    codeBlockStyle:'fenced',
    bulletListMarker:'-'
  });

  turndownService.addRule('strikethrough', {
    filter: ['del','s','strike'],
    replacement: (content) => '~~' + content + '~~'
  });

  turndownService.addRule('taskCheckbox', {
    filter: (node) => node.nodeName === 'INPUT' && node.type === 'checkbox',
    replacement: (content, node) => (node.checked ? '[x]' : '[ ]') + ' '
  });

  function isFirstBodyRow(el){
    const prev = el.previousSibling;
    return el.nodeName === 'TBODY' && (!prev || (prev.nodeName === 'THEAD' && /^\s*$/.test(prev.textContent)));
  }
  function isHeaderRow(tr){
    const parent = tr.parentNode;
    return parent.nodeName === 'THEAD' || (parent.firstChild === tr && (parent.nodeName === 'TABLE' || isFirstBodyRow(parent)));
  }
  turndownService.addRule('tableCell', {
    filter: ['th','td'],
    replacement: (content, node) => {
      const index = Array.prototype.indexOf.call(node.parentNode.childNodes, node);
      const text = content.trim().replace(/\n+/g, ' ');
      return (index === 0 ? '| ' : ' ') + text + ' |';
    }
  });
  turndownService.addRule('tableRow', {
    filter: 'tr',
    replacement: (content, node) => {
      let row = '\n' + content;
      if(isHeaderRow(node)){
        const cols = node.childNodes.length;
        row += '\n' + Array.from({length:cols}, () => '| --- ').join('') + '|';
      }
      return row;
    }
  });
  turndownService.addRule('tableSection', {
    filter: ['thead','tbody','tfoot'],
    replacement: (content) => content
  });
  turndownService.addRule('table', {
    filter: 'table',
    replacement: (content) => '\n\n' + content.replace(/\n{2,}/g, '\n') + '\n\n'
  });

  // preview에서 실제 편집(input)이 있었을 때만 true.
  // 편집 없이 포커스/블러만 해도 Turndown 왕복 변환으로 원본 마크다운이 바뀌는 것을 막는다.
  let previewDirty = false;
  let previewSyncTimer = null;
  function syncEditorFromPreview(){
    editor.value = turndownService.turndown(getMarkdownSourceHtml());
  }
  function schedulePreviewSync(){
    previewDirty = true;
    clearTimeout(previewSyncTimer);
    previewSyncTimer = setTimeout(() => {
      if(!previewDirty) return;
      syncEditorFromPreview();
      updateStats();
      updateLineNumbers();
      scheduleDraftSave();
    }, 500);
  }
  function flushPreviewSync(){
    clearTimeout(previewSyncTimer);
    if(!previewDirty) return;
    syncEditorFromPreview();
    render();
    scheduleDraftSave();
  }

  const SAMPLE = `# 마크다운 변환기

왼쪽에 마크다운을 입력하면 오른쪽에서 실시간으로 렌더링됩니다.

## 기능

- **굵게**, *기울임*, \`인라인 코드\`
- 체크리스트
  - [x] 파일 드래그 앤 드롭
  - [x] HTML 내보내기
  - [x] 표 열 너비 드래그 조절
  - [ ] 다음 기능

## 코드 블록

\`\`\`javascript
function hello(name) {
  return \`Hello, \${name}!\`;
}
\`\`\`

## 표

| 항목 | 상태 | 비고 |
|------|------|------|
| 렌더링 | 완료 | 실시간 미리보기 |
| 내보내기 | 완료 | 내보낸 HTML에서도 표 경계선 드래그 가능 |

> 인용문도 이렇게 표시됩니다.
`;

  const MIN_TABLE_COL_WIDTH = 48;
  let tableColumnWidthsByIndex = [];

  turndownService.addRule('tableResizeArtifacts', {
    filter: (node) => {
      if(node.nodeName === 'COLGROUP' || node.nodeName === 'COL') return true;
      return node.classList && (
        node.classList.contains('col-resize-handle') ||
        node.classList.contains('table-tools') ||
        node.classList.contains('table-copy-excel-btn')
      );
    },
    replacement: () => ''
  });

  function getFirstTableRow(table){
    if(table.tHead && table.tHead.rows.length) return table.tHead.rows[0];
    return table.querySelector('tr');
  }

  function getColumnCount(table){
    const rows = Array.from(table.rows || []);
    const count = rows.reduce((max, row) => {
      const rowCount = Array.from(row.cells).reduce((sum, cell) => sum + Math.max(1, cell.colSpan || 1), 0);
      return Math.max(max, rowCount);
    }, 0);
    return count;
  }

  function getColgroup(table){
    return Array.from(table.children).find(child => child.tagName === 'COLGROUP') || null;
  }

  function readColWidths(table){
    const colgroup = getColgroup(table);
    if(colgroup){
      const widths = Array.from(colgroup.children)
        .filter(col => col.tagName === 'COL')
        .map(col => parseFloat(col.style.width || col.getAttribute('width') || '0'))
        .filter(width => Number.isFinite(width) && width > 0);
      if(widths.length) return widths;
    }
    const stored = (table.dataset.colWidths || '').split(',')
      .map(value => parseFloat(value))
      .filter(value => Number.isFinite(value) && value > 0);
    if(stored.length) return stored;
    const firstRow = getFirstTableRow(table);
    if(!firstRow) return [];
    return Array.from(firstRow.cells).map(cell => {
      const width = cell.getBoundingClientRect().width;
      return Math.max(MIN_TABLE_COL_WIDTH, Math.round(width || MIN_TABLE_COL_WIDTH));
    });
  }

  function makeDefaultColWidths(table, tableIndex){
    const columnCount = getColumnCount(table);
    if(!columnCount) return [];
    const saved = tableColumnWidthsByIndex[tableIndex];
    if(Array.isArray(saved) && saved.length === columnCount){
      return saved.map(width => Math.max(MIN_TABLE_COL_WIDTH, Math.round(width)));
    }
    const fromMarkup = readColWidths(table);
    if(fromMarkup.length === columnCount){
      return fromMarkup.map(width => Math.max(MIN_TABLE_COL_WIDTH, Math.round(width)));
    }
    const parentWidth = table.parentElement ? table.parentElement.clientWidth : 0;
    const tableWidth = table.getBoundingClientRect().width;
    const total = Math.max(columnCount * MIN_TABLE_COL_WIDTH, Math.round(tableWidth || parentWidth || 680));
    const base = Math.max(MIN_TABLE_COL_WIDTH, Math.floor(total / columnCount));
    const widths = Array.from({length:columnCount}, () => base);
    widths[widths.length - 1] += total - (base * columnCount);
    return widths;
  }

  function ensureColgroup(table, columnCount){
    let colgroup = getColgroup(table);
    if(!colgroup){
      colgroup = document.createElement('colgroup');
      colgroup.dataset.mdRenderColgroup = 'true';
      table.insertBefore(colgroup, table.firstChild);
    }
    colgroup.dataset.mdRenderColgroup = 'true';
    while(colgroup.children.length < columnCount){
      colgroup.appendChild(document.createElement('col'));
    }
    while(colgroup.children.length > columnCount){
      colgroup.removeChild(colgroup.lastElementChild);
    }
    return colgroup;
  }

  function applyColWidths(table, widths, persist = false){
    const safeWidths = widths.map(width => Math.max(MIN_TABLE_COL_WIDTH, Math.round(width)));
    const colgroup = ensureColgroup(table, safeWidths.length);
    Array.from(colgroup.children).forEach((col, index) => {
      col.style.width = safeWidths[index] + 'px';
    });
    const totalWidth = safeWidths.reduce((sum, width) => sum + width, 0);
    table.style.width = totalWidth + 'px';
    table.style.minWidth = totalWidth + 'px';
    table.dataset.colWidths = safeWidths.join(',');
    if(persist){
      const tableIndex = Number(table.dataset.tableIndex);
      if(Number.isInteger(tableIndex)){
        tableColumnWidthsByIndex[tableIndex] = safeWidths;
      }
    }
  }

  function getCleanTableCellText(cell){
    const clone = cell.cloneNode(true);
    clone.querySelectorAll('.col-resize-handle,.table-tools,.table-copy-excel-btn').forEach(node => node.remove());
    return clone.textContent
      .replace(/\u00a0/g, ' ')
      .replace(/[\t\r\n]+/g, ' ')
      .replace(/\s+/g, ' ')
      .trim();
  }

  function tableToExcelText(table){
    const matrix = [];
    Array.from(table.rows || []).forEach((row, rowIndex) => {
      if(!matrix[rowIndex]) matrix[rowIndex] = [];
      let colIndex = 0;
      Array.from(row.cells || []).forEach(cell => {
        while(matrix[rowIndex][colIndex] !== undefined) colIndex++;
        const text = getCleanTableCellText(cell);
        const rowSpan = Math.max(1, cell.rowSpan || 1);
        const colSpan = Math.max(1, cell.colSpan || 1);
        for(let r = 0; r < rowSpan; r++){
          const targetRow = rowIndex + r;
          if(!matrix[targetRow]) matrix[targetRow] = [];
          for(let c = 0; c < colSpan; c++){
            matrix[targetRow][colIndex + c] = (r === 0 && c === 0) ? text : '';
          }
        }
        colIndex += colSpan;
      });
    });
    const maxCols = matrix.reduce((max, row) => Math.max(max, row.length), 0);
    return matrix
      .map(row => Array.from({length:maxCols}, (_, index) => row[index] ?? '').join('\t'))
      .join('\n');
  }

  function fallbackCopyText(text){
    const textarea = document.createElement('textarea');
    textarea.value = text;
    textarea.setAttribute('readonly', '');
    textarea.style.position = 'fixed';
    textarea.style.left = '-9999px';
    textarea.style.top = '0';
    document.body.appendChild(textarea);
    textarea.select();
    try{
      document.execCommand('copy');
      return true;
    }finally{
      textarea.remove();
    }
  }

    try{
      if(navigator.clipboard && window.isSecureContext){
        await navigator.clipboard.writeText(text);
      }else{
        fallbackCopyText(text);

      button.textContent = '복사됨';
      button.dataset.state = 'copied';
      setTimeout(() => {
        button.textContent = old;

  function wrapTable(table){

    const wrapper = document.createElement('div');

  function addColumnResizeHandles(table){
    table.querySelectorAll('.col-resize-handle').forEach(handle => handle.remove());
    const firstRow = getFirstTableRow(table);
    if(!firstRow) return;
    Array.from(firstRow.cells).forEach((cell, colIndex) => {

      cell.appendChild(handle);
    });

  function startColumnResize(event){
    event.preventDefault();
    event.stopPropagation();
    const handle = event.currentTarget;
    const table = handle.closest('table');
    if(!table) return;
    const colIndex = Number(handle.dataset.colIndex);
    const startWidths = readColWidths(table);
    if(!startWidths[colIndex]) return;
    const startX = event.clientX;
    const startColWidth = startWidths[colIndex];
    document.body.classList.add('table-resizing');

    const onPointerMove = (moveEvent) => {
      const deltaX = moveEvent.clientX - startX;
      const nextWidths = startWidths.slice();
      nextWidths[colIndex] = Math.max(MIN_TABLE_COL_WIDTH, startColWidth + deltaX);
      applyColWidths(table, nextWidths, true);
    };
    const onPointerUp = () => {
      document.body.classList.remove('table-resizing');
      document.removeEventListener('pointermove', onPointerMove);
      document.removeEventListener('pointerup', onPointerUp);
    };

    document.addEventListener('pointermove', onPointerMove);
    document.addEventListener('pointerup', onPointerUp, {once:true});
  }

  function captureTableWidths(){
    preview.querySelectorAll('table.resizable-table').forEach((table, tableIndex) => {

  function enhanceResizableTables(root = preview){

      const widths = makeDefaultColWidths(table, tableIndex);
      if(widths.length){

      }
      addColumnResizeHandles(table);
    });
  }

  function unwrapTableWrappers(root){
    root.querySelectorAll('.table-wrap').forEach(wrapper => {
      const table = Array.from(wrapper.children).find(child => child.tagName === 'TABLE');
      if(table){
        wrapper.replaceWith(table);
      }else{
        wrapper.replaceWith(...Array.from(wrapper.childNodes));

    });

  function exportResizableTablesScript(){
    const MIN_TABLE_COL_WIDTH = 48;
    function getFirstTableRow(table){
      if(table.tHead && table.tHead.rows.length) return table.tHead.rows[0];
      return table.querySelector('tr');
    }
    function getColumnCount(table){
      return Array.from(table.rows || []).reduce((max, row) => {
        const rowCount = Array.from(row.cells).reduce((sum, cell) => sum + Math.max(1, cell.colSpan || 1), 0);
        return Math.max(max, rowCount);

          .filter(width => Number.isFinite(width) && width > 0);

        .map(value => parseFloat(value))
        .filter(value => Number.isFinite(value) && value > 0);

    }

      let colgroup = getColgroup(table);

        colgroup = document.createElement('colgroup');
        colgroup.dataset.mdRenderColgroup = 'true';
        table.insertBefore(colgroup, table.firstChild);

      colgroup.dataset.mdRenderColgroup = 'true';
      while(colgroup.children.length < columnCount) colgroup.appendChild(document.createElement('col'));
      while(colgroup.children.length > columnCount) colgroup.removeChild(colgroup.lastElementChild);
      return colgroup;
    }
    function applyColWidths(table, widths){
      const safeWidths = widths.map(width => Math.max(MIN_TABLE_COL_WIDTH, Math.round(width)));
      const colgroup = ensureColgroup(table, safeWidths.length);
      Array.from(colgroup.children).forEach((col, index) => { col.style.width = safeWidths[index] + 'px'; });
      const totalWidth = safeWidths.reduce((sum, width) => sum + width, 0);

      table.style.minWidth = totalWidth + 'px';
      table.dataset.colWidths = safeWidths.join(',');

    function makeDefaultColWidths(table){
      const columnCount = getColumnCount(table);
      if(!columnCount) return [];
      const fromMarkup = readColWidths(table);
      if(fromMarkup.length === columnCount) return fromMarkup.map(width => Math.max(MIN_TABLE_COL_WIDTH, Math.round(width)));
      const parentWidth = table.parentElement ? table.parentElement.clientWidth : 0;
      const tableWidth = table.getBoundingClientRect().width;
      const total = Math.max(columnCount * MIN_TABLE_COL_WIDTH, Math.round(tableWidth || parentWidth || 680));
      const base = Math.max(MIN_TABLE_COL_WIDTH, Math.floor(total / columnCount));
      const widths = Array.from({length:columnCount}, () => base);
      widths[widths.length - 1] += total - (base * columnCount);
      return widths;
    }

          for(let r = 0; r < rowSpan; r++){
            const targetRow = rowIndex + r;
            if(!matrix[targetRow]) matrix[targetRow] = [];
            for(let c = 0; c < colSpan; c++){
              matrix[targetRow][colIndex + c] = (r === 0 && c === 0) ? text : '';
            }
          }
          colIndex += colSpan;
        });
      });
      const maxCols = matrix.reduce((max, row) => Math.max(max, row.length), 0);
      return matrix
        .map(row => Array.from({length:maxCols}, (_, index) => row[index] ?? '').join('\t'))
        .join('\n');
    }
    function fallbackCopyText(text){
      const textarea = document.createElement('textarea');
      textarea.value = text;
      textarea.setAttribute('readonly', '');
      textarea.style.position = 'fixed';
      textarea.style.left = '-9999px';
      textarea.style.top = '0';
      document.body.appendChild(textarea);
      textarea.select();
      try{
        document.execCommand('copy');

    async function copyTableAsExcel(table, button){

    function ensureTableTools(table, wrapper){
      wrapper.querySelectorAll(':scope > .table-tools').forEach(tools => tools.remove());
      const tools = document.createElement('div');

  }
  window.addEventListener('pagehide', flushPendingSave);
  document.addEventListener('visibilitychange', () => {
    if(document.visibilityState === 'hidden') flushPendingSave();
  });

  const savedTheme = storageGet(STORAGE_KEYS.theme);
  applyTheme(savedTheme === 'light' || savedTheme === 'dark' ? savedTheme : (document.documentElement.getAttribute('data-theme') || 'dark'));

  const savedDraft = storageGet(STORAGE_KEYS.draft);
  editor.value = savedDraft !== null ? savedDraft : SAMPLE;
  render();
</script>
</body>
</html>
